version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: annotation_ops_db
    environment:
      POSTGRES_DB: annotation_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: annotation_ops_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/annotation_ops
      SECRET_KEY: enterprise-super-secret-jwt-signing-key-production-ready-2026
      ENVIRONMENT: production
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: annotation_ops_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # Optional containerized Ollama server for full in-Docker AI inference
  # Start with: docker compose --profile ai up
  ollama:
    image: ollama/ollama:latest
    container_name: annotation_ops_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles: ["ai", "full"]

volumes:
  postgres_data:
  ollama_models:
